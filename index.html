<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookmarks Manager</title>
    <link rel="stylesheet" href="main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet" />
  </head>
  <body>
    <main>
      <h1>Bookmarks Manager</h1>
      <div class="container">
        <form id="bookmark-form">
          <h2>Add New Bookmark</h2>
          <label for="bookmark-title">Website name</label>
          <input id="bookmark-title" type="text" class="title" placeholder="Example: MDN Web Docs" maxlength="120" required />
          <label for="bookmark-url">Website URL</label>
          <input id="bookmark-url" type="url" class="url" placeholder="https://example.com" required />
          <div class="category-suggestions">
            <h3>Choose an existing category or add a new one</h3>
            <div aria-label="Category suggestions"></div>
          </div>
          <label for="bookmark-category">Category</label>
          <input id="bookmark-category" type="text" class="category" placeholder="Example: Learning" maxlength="60" required />
          <button type="submit">Add bookmark</button>
          <p id="bookmark-status" role="status" aria-live="polite">Your bookmarks are stored only in this browser.</p>
        </form>
        <button type="button" class="all">Show all bookmarks</button>
        <section class="category-buttons" aria-labelledby="category-heading">
          <h2 id="category-heading">Filter by category</h2>
          <div aria-label="Bookmark categories"></div>
        </section>
        <section class="bookmarks" aria-label="Saved bookmarks"></section>
      </div>
    </main>
    <script src="main.js"></script>
  </body>
</html>
